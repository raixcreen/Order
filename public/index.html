<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑞艾呷奔趣</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <h1>瑞艾呷奔趣</h1>
    <div>
      <a href="index.html" class="active">訂餐</a>
      <a href="admin.html">管理</a>
    </div>
  </nav>

  <!-- 步驟一：選擇員工 -->
  <div id="loginScreen" class="login-screen">
    <div class="card">
      <h2>選擇你的名字</h2>
      <p>請先選擇身份，再進行今日訂餐</p>
      <div class="form-group">
        <select id="employeeSelect" class="form-control">
          <option value="">-- 請選擇員工 --</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="employeeLogin()" style="width:100%">開始訂餐</button>
    </div>
  </div>

  <!-- 步驟二：訂餐畫面 -->
  <div id="orderScreen" class="container" style="display:none">
    <div class="card">
      <div class="card-title">
        <span class="icon">&#127860;</span>
        <span>今日菜單 — <span id="todayDate"></span></span>
        <span style="margin-left:auto; display:flex; align-items:center; gap:8px;">
          <span id="empInfo" style="font-size:.85rem; color:var(--gray-500);"></span>
          <button class="btn btn-outline btn-sm" onclick="switchEmployee()">切換身份</button>
        </span>
      </div>
      <!-- 截止時間提示 + 商家備註 -->
      <div id="deadlineRow" style="display:none; margin-bottom:16px; gap:12px; align-items:center; flex-wrap:wrap;">
        <div id="deadlineBanner" style="padding:12px 16px; border-radius:8px; font-weight:600; font-size:.9rem;"></div>
        <div id="vendorNote" style="display:none; padding:10px 14px; background:var(--gray-100); border-radius:8px; font-size:.85rem; color:var(--gray-600);"></div>
      </div>

      <!-- 菜單圖片（可收合） -->
      <div id="menuImageSection" style="display:none; margin-bottom:20px;">
        <div onclick="toggleMenuImage()" style="cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px; margin-bottom:8px;">
          <span style="font-weight:600; font-size:.9rem; color:var(--gray-600);">菜單圖片</span>
          <span id="menuImageToggle" style="font-size:.75rem; color:var(--gray-400); transition:transform .2s;">▼</span>
        </div>
        <div id="menuImageContent" style="text-align:center;">
          <img id="menuImageDisplay" style="max-width:100%; border-radius:8px; border:1px solid var(--gray-200); cursor:pointer;" onclick="toggleImageZoom(this)" title="點擊放大">
        </div>
      </div>

      <!-- 自訂品項 -->
      <div id="customItemSection" style="margin-bottom:16px; padding:12px 16px; background:var(--gray-50); border-radius:8px;">
        <div style="font-weight:600; font-size:.9rem; margin-bottom:8px;">自訂品項</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <input type="text" id="customItemName" class="form-control" placeholder="品項名稱" style="flex:2; min-width:120px;">
          <input type="number" id="customItemPrice" class="form-control" placeholder="金額" style="flex:1; min-width:80px;">
          <button class="btn btn-primary btn-sm" onclick="addCustomItem()">加入</button>
        </div>
      </div>

      <div id="menuGrid" class="menu-grid"></div>
      <div id="emptyMenu" class="empty-state" style="display:none">
        <div class="icon">&#128196;</div>
        <p>今日尚未設定菜單，請聯絡管理員</p>
      </div>
    </div>

    <!-- 已點餐項目（可收合） -->
    <div id="myOrderCard" class="card" style="display:none">
      <div class="card-title" onclick="toggleOrderDetail()" style="cursor:pointer; user-select:none;">
        <span class="icon">&#9989;</span>
        <span>你今天已訂的餐點</span>
        <span id="myOrderSummaryText" style="margin-left:8px; font-size:.85rem; font-weight:400; color:var(--gray-500);"></span>
        <span id="myOrderToggle" style="margin-left:auto; font-size:.8rem; color:var(--gray-400); transition:transform .2s;">&#9660;</span>
      </div>
      <div id="myOrderDetail" style="display:none;">
        <div id="editHint" style="margin-bottom:12px; padding:10px 14px; background:#EEF2FF; border-radius:8px; font-size:.85rem; color:var(--primary-dark);">
          可直接在上方菜單調整數量，再按「更新訂單」即可修改
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>品項</th><th>數量</th><th>小計</th></tr></thead>
            <tbody id="myOrderBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- 歷史訂單 -->
    <div id="historyCard" class="card" style="display:none;">
      <div class="card-title" onclick="toggleHistoryDetail()" style="cursor:pointer; user-select:none;">
        <span class="icon">&#128197;</span>
        <span>歷史訂單</span>
        <span id="historyToggle" style="margin-left:auto; font-size:.8rem; color:var(--gray-400); transition:transform .2s; transform:rotate(-90deg);">&#9660;</span>
      </div>
      <div id="historyDetail" style="display:none;">
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <!-- 底部訂單摘要 -->
  <div id="orderSummary" class="order-summary" style="display:none">
    <div>
      <div class="items-count"><span id="summaryCount">0</span> 項餐點</div>
      <div class="total">合計 <span id="summaryTotal">$0</span></div>
    </div>
    <button class="btn btn-success" id="submitBtn" onclick="submitOrder()">送出訂單</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/employee.js"></script>
</body>
</html>
